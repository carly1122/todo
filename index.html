<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    padding: 32px 28px;
  }
  h1 { font-size: 24px; color: #333; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 24px; }
  .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  #taskInput {
    flex: 1; padding: 12px 16px; border: 2px solid #e0e0e0;
    border-radius: 10px; font-size: 15px; outline: none; transition: border-color .2s;
  }
  #taskInput:focus { border-color: #667eea; }
  #addBtn {
    padding: 12px 22px; background: #667eea; color: #fff; border: none;
    border-radius: 10px; font-size: 15px; cursor: pointer; transition: background .2s;
  }
  #addBtn:hover { background: #5a6fd6; }
  #list { list-style: none; }
  #list li {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px; border-bottom: 1px solid #f0f0f0;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px);} to { opacity: 1; transform: translateY(0);} }
  #list li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #667eea; }
  #list li .text { flex: 1; font-size: 15px; color: #333; word-break: break-all; }
  #list li.done .text { text-decoration: line-through; color: #bbb; }
  .del-btn {
    background: none; border: none; color: #ccc; font-size: 18px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all .2s;
  }
  .del-btn:hover { color: #e74c3c; background: #fdecea; }
  .footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #999; }
  #clearDone { background: none; border: none; color: #999; font-size: 13px; cursor: pointer; }
  #clearDone:hover { color: #e74c3c; }
  .empty { text-align: center; color: #ccc; padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="app">
    <h1>📝 待办清单</h1>
    <p class="subtitle">数据保存在浏览器本地，关闭也不会丢</p>
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="要做点什么？回车添加" maxlength="100">
      <button id="addBtn">添加</button>
    </div>
    <ul id="list"></ul>
    <div class="footer">
      <span id="count"></span>
      <button id="clearDone">清除已完成</button>
    </div>
  </div>

<script>
  let tasks = JSON.parse(localStorage.getItem('my-todos') || '[]');
  const list = document.getElementById('list');
  const input = document.getElementById('taskInput');
  const countEl = document.getElementById('count');

  function save() { localStorage.setItem('my-todos', JSON.stringify(tasks)); }

  function render() {
    list.innerHTML = '';
    if (tasks.length === 0) list.innerHTML = '<li class="empty">还没有任务，添加一个吧 ✨</li>';
    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      if (task.done) li.classList.add('done');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => { tasks[i].done = checkbox.checked; save(); render(); });
      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = task.text;
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.title = '删除';
      del.addEventListener('click', () => { tasks.splice(i, 1); save(); render(); });
      li.appendChild(checkbox); li.appendChild(span); li.appendChild(del);
      list.appendChild(li);
    });
    const undone = tasks.filter(t => !t.done).length;
    countEl.textContent = `共 ${tasks.length} 项，未完成 ${undone} 项`;
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ text, done: false });
    input.value = ''; save(); render(); input.focus();
  }

  document.getElementById('addBtn').addEventListener('click', addTask);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  document.getElementById('clearDone').addEventListener('click', () => { tasks = tasks.filter(t => !t.done); save(); render(); });

  render();
</script>
</body>
</html>
