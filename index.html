<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办清单</title>
<style>
  /* ===== 白天主题（默认）===== */
  :root {
    --body-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --app-bg: #ffffff;
    --app-shadow: 0 20px 60px rgba(0,0,0,.3);
    --title-color: #333333;
    --subtitle-color: #999999;
    --task-color: #333333;
    --done-color: #bbbbbb;
    --border-color: #f0f0f0;
    --input-bg: #ffffff;
    --input-border: #e0e0e0;
    --input-text: #333333;
    --empty-color: #cccccc;
  }
  /* ===== 夜晚主题 ===== */
  body.dark {
    --body-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    --app-bg: #1e1e30;
    --app-shadow: 0 20px 60px rgba(0,0,0,.6);
    --title-color: #e8e8f0;
    --subtitle-color: #77778a;
    --task-color: #d8d8e4;
    --done-color: #55556a;
    --border-color: #33334a;
    --input-bg: #2a2a40;
    --input-border: #44445e;
    --input-text: #e0e0ee;
    --empty-color: #55556a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--body-bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
    transition: background .3s;
  }
  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: var(--app-bg);
    border-radius: 16px;
    box-shadow: var(--app-shadow);
    padding: 32px 28px;
    transition: background .3s;
  }
  #themeBtn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    transition: transform .2s;
  }
  #themeBtn:hover { transform: scale(1.2); }
  h1 { font-size: 24px; color: var(--title-color); text-align: center; margin-bottom: 4px; transition: color .3s; }
  .subtitle { text-align: center; color: var(--subtitle-color); font-size: 13px; margin-bottom: 24px; transition: color .3s; }
  .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  #taskInput {
    flex: 1; padding: 12px 16px;
    background: var(--input-bg); border: 2px solid var(--input-border);
    border-radius: 10px; font-size: 15px; color: var(--input-text);
    outline: none; transition: border-color .2s, background .3s;
  }
  #taskInput:focus { border-color: #667eea; }
  #addBtn {
    padding: 12px 22px; background: #667eea; color: #fff; border: none;
    border-radius: 10px; font-size: 15px; cursor: pointer; transition: background .2s;
  }
  #addBtn:hover { background: #5a6fd6; }
  #list { list-style: none; }
  #list li {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px; border-bottom: 1px solid var(--border-color);
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px);} to { opacity: 1; transform: translateY(0);} }
  #list li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: #667eea; }
  #list li .text { flex: 1; font-size: 15px; color: var(--task-color); word-break: break-all; cursor: default; transition: color .3s; }
  #list li.done .text { text-decoration: line-through; color: var(--done-color); }
  .edit-input {
    flex: 1; padding: 6px 10px; border: 2px solid #667eea;
    background: var(--input-bg); color: var(--input-text);
    border-radius: 6px; font-size: 15px; outline: none;
  }
  .del-btn {
    background: none; border: none; color: #ccc; font-size: 18px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all .2s;
  }
  .del-btn:hover { color: #e74c3c; background: #fdecea; }
  .footer {
    margin-top: 20px; display: flex; justify-content: space-between;
    align-items: center; font-size: 13px; color: var(--subtitle-color); gap: 10px; flex-wrap: wrap;
    transition: color .3s;
  }
  .footer-btns { display: flex; gap: 12px; }
  #clearDone, #clearAll {
    background: none; border: none; color: var(--subtitle-color); font-size: 13px;
    cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: all .2s;
  }
  #clearDone:hover { color: #e67e22; }
  #clearAll:hover { color: #e74c3c; }
  #clearAll.confirming {
    color: #fff; background: #e74c3c;
    padding: 4px 10px;
  }
  .empty { text-align: center; color: var(--empty-color); padding: 30px 0; font-size: 14px; transition: color .3s; }
</style>
</head>
<body>
  <div class="app">
    <button id="themeBtn" title="切换主题">🌙</button>
    <h1>📝 待办清单</h1>
    <p class="subtitle">数据保存在浏览器本地，关闭也不会丢</p>
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="要做点什么？回车添加" maxlength="100">
      <button id="addBtn">添加</button>
    </div>
    <ul id="list"></ul>
    <div class="footer">
      <span id="count"></span>
      <div class="footer-btns">
        <button id="clearDone">清除已完成</button>
        <button id="clearAll">清空全部</button>
      </div>
    </div>
  </div>

<script>
  let tasks = JSON.parse(localStorage.getItem('my-todos') || '[]');

  const list = document.getElementById('list');
  const input = document.getElementById('taskInput');
  const countEl = document.getElementById('count');
  const clearAllBtn = document.getElementById('clearAll');
  const themeBtn = document.getElementById('themeBtn');

  function save() { localStorage.setItem('my-todos', JSON.stringify(tasks)); }

  // ===== 主题切换 =====
  function applyTheme(mode) {
    document.body.classList.toggle('dark', mode === 'dark');
    themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
    themeBtn.title = mode === 'dark' ? '切换到浅色' : '切换到深色';
  }
  let theme = localStorage.getItem('my-todos-theme') || 'light';
  applyTheme(theme);

  themeBtn.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('my-todos-theme', theme);
    applyTheme(theme);
  });

  function render() {
    list.innerHTML = '';
    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty">还没有任务，添加一个吧 ✨</li>';
    }
    const sorted = tasks
      .map((task, i) => ({ task, i }))
      .sort((a, b) => Number(a.task.done) - Number(b.task.done));

    sorted.forEach(({ task, i }) => {
      const li = document.createElement('li');
      if (task.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.addEventListener('change', () => {
        tasks[i].done = checkbox.checked;
        save();
        render();
      });

      const span = document.createElement('span');
      span.className = 'text';
      span.textContent = task.text;
      span.title = '双击可编辑';
      span.addEventListener('dblclick', () => {
        const editInput = document.createElement('input');
        editInput.type = 'text';
        editInput.className = 'edit-input';
        editInput.value = task.text;
        editInput.maxLength = 100;

        let finished = false;
        function commit(saveChanges) {
          if (finished) return;
          finished = true;
          if (saveChanges) {
            const newText = editInput.value.trim();
            if (newText) tasks[i].text = newText;
          }
          save();
          render();
        }

        editInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') commit(true);
          if (e.key === 'Escape') commit(false);
        });
        editInput.addEventListener('blur', () => commit(true));

        li.replaceChild(editInput, span);
        editInput.focus();
        editInput.select();
      });

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.title = '删除';
      del.addEventListener('click', () => {
        tasks.splice(i, 1);
        save();
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(del);
      list.appendChild(li);
    });

    const undone = tasks.filter(t => !t.done).length;
    countEl.textContent = `共 ${tasks.length} 项，未完成 ${undone} 项`;
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ text, done: false });
    input.value = '';
    save();
    render();
    input.focus();
  }

  document.getElementById('addBtn').addEventListener('click', addTask);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  document.getElementById('clearDone').addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  // 清空全部：两步确认，防误删
  let confirmTimer = null;
  clearAllBtn.addEventListener('click', () => {
    if (!clearAllBtn.classList.contains('confirming')) {
      clearAllBtn.classList.add('confirming');
      clearAllBtn.textContent = '再点一次确认清空';
      clearAllBtn.title = '3 秒内再次点击才会真正清空';
      confirmTimer = setTimeout(resetClearAll, 3000);
    } else {
      clearTimeout(confirmTimer);
      tasks = [];
      save();
      render();
      resetClearAll();
    }
  });

  function resetClearAll() {
    clearAllBtn.classList.remove('confirming');
    clearAllBtn.textContent = '清空全部';
    clearAllBtn.title = '';
  }

  render();
</script>
</body>
</html>
